project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "resources/*.qmd"
    - "projects/*.qmd"
    - "!_archive_*.qmd"

website:
  title: "Novi mediji i web tehnologije | KOMP4-3"

            href: lectures/week-06.qmd
          - text: "— Modul III: Strategija, iskustvo, distribucija —"
          - text: "T7: Sadržajna strategija i pisanje za web"
            href: lectures/week-07.qmd
          - text: "T8: UX, UI i pristupačan dizajn za web"
            href: lectures/week-08.qmd
          - text: "T9: Platforme, algoritmi i distribucija"
            href: lectures/week-09.qmd

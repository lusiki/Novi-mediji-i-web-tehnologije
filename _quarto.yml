            href: lectures/week-02.qmd
          - text: "T3: Vrednovanje informacija i provjera izvora"
            href: lectures/week-03.qmd
          - text: "— Modul II: Produkcija sadržaja —"
          - text: "T4: Sustavi za upravljanje sadržajem"
            href: lectures/week-04.qmd
          - text: "T5: No code i low code alati"
            href: lectures/week-05.qmd
